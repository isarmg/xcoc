import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import java.security.MessageDigest

// Export only the exact release runtime resolution. Plugin, test and debug
// configurations never become delivered Android runtime components.
def repositories = []
gradle.settingsEvaluated { settings ->
    repositories = settings.dependencyResolutionManagement.repositories
        .withType(MavenArtifactRepository).collect { it.url.toString() }
}
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportXssiRuntimeInventory') {
        doLast {
            def output = app.providers.gradleProperty('xssiRuntimeExport').get()
            def configuration = app.configurations.getByName('releaseRuntimeClasspath')
            def artifacts = [:].withDefault { [] }
            configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def coordinate = artifact.moduleVersion.id
                def identity = "${coordinate.group}:${coordinate.name}:${coordinate.version}".toString()
                def digest = MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) { digest.update(buffer, 0, count) }
                }
                artifacts[identity] << [path: artifact.file.canonicalPath,
                    filename: artifact.file.name, sha256: digest.digest().encodeHex().toString()]
            }
            def result = configuration.incoming.resolutionResult
            def components = result.allComponents.findAll {
                it.id instanceof ModuleComponentIdentifier && artifacts.containsKey(it.id.displayName)
            }
            def selected = components.collect { it.id.displayName }.toSet()
            def dependencies = { component ->
                def children = [] as Set
                def inspected = [] as Set
                def visit
                visit = { current ->
                    if (!inspected.add(current.id.displayName)) { return }
                    current.dependencies.each { dependency ->
                        if (dependency instanceof UnresolvedDependencyResult) {
                            throw new GradleException('Release runtime dependency did not resolve')
                        }
                        if (dependency instanceof ResolvedDependencyResult && !dependency.constraint) {
                            if (selected.contains(dependency.selected.id.displayName)) {
                                children.add(dependency.selected.id.displayName)
                            } else { visit(dependency.selected) }
                        }
                    }
                }
                visit(component)
                children.toList().sort()
            }
            def publicRepositories = (repositories + app.repositories
                .withType(MavenArtifactRepository).collect { it.url.toString() }).unique().sort()
            def document = [format_version: 1, configuration: 'releaseRuntimeClasspath',
                root: [id: result.root.id.displayName, dependencies: dependencies(result.root)],
                repositories: publicRepositories,
                components: components.collect { component ->
                    def identifier = component.id
                    [id: identifier.displayName, group: identifier.group, name: identifier.module,
                     version: identifier.version, artifacts: artifacts[identifier.displayName],
                     dependencies: dependencies(component)]
                }.sort { it.id }]
            def destination = new File(output)
            if (destination.exists()) { throw new GradleException('Refusing to overwrite runtime resolution export') }
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(document)) + '\n'
        }
    }
}
