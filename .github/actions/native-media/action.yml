name: Build reviewed native media libraries
description: Statically link pinned FFmpeg while keeping desktop releases self-contained.
runs:
  using: composite
  steps:
    - name: Install Linux build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y build-essential binutils curl libssl-dev libzstd-dev zlib1g-dev pkg-config xz-utils
    - name: Install macOS build prerequisites
      if: runner.os == 'macOS'
      shell: bash
      run: brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
    - name: Identify native compiler image
      id: image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    # Preserve matching source downloads, recipes and build configuration with
    # the installed archives: release receipts require these on cache hits too.
    # Never restore by a partial key or skip the provisioning/source checks.
    - name: Restore reviewed native build workspace
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ runner.temp }}/xcoc-native/install
          ${{ runner.temp }}/xcoc-native/source
          ${{ runner.temp }}/xcoc-native/installed
          ${{ runner.temp }}/xcoc-native/vcpkg
          !${{ runner.temp }}/xcoc-native/vcpkg/packages
          !${{ runner.temp }}/xcoc-native/vcpkg/buildtrees/**/*.obj
          !${{ runner.temp }}/xcoc-native/vcpkg/buildtrees/**/*.o
        key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('packaging/native/**', '.github/actions/native-media/action.yml') }}
    - name: Build Unix static media libraries
      if: runner.os != 'Windows'
      shell: bash
      run: |
        bash packaging/native/build-unix.sh "$RUNNER_TEMP/xcoc-native/install" "$RUNNER_TEMP/xcoc-native/source"
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/xcoc-native/install/lib/pkgconfig" >> "$GITHUB_ENV"
    - name: Build Windows static media libraries and CRT
      if: runner.os == 'Windows'
      shell: pwsh
      run: .\packaging\native\build-windows.ps1 -WorkDirectory "$env:RUNNER_TEMP\xcoc-native"
