name: Cache exact Rust build inputs
description: Reuse compilation only; all source, test and release validation still runs.
inputs:
  lane:
    description: Separate incompatible targets and compiler flags
    required: true
runs:
  using: composite
  steps:
    - name: Identify runner image
      id: image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Restore Rust dependencies and build products
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ inputs.lane }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/build.rs', '.cargo/**', 'packaging/native/**', '.github/actions/rust-build-cache/action.yml') }}
